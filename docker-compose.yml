services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vko-archive-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-vko_archive}
    ports:
      # Localhost only: the database must not be reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vko_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  vko_pgdata:
